services:
  db:
    image: postgres:16
    container_name: line-zousanbook-db
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:${POSTGRES_PORT}"
    volumes:
      - db-data:/var/lib/postgresql/data

volumes:
  db-data:
